name: Release

# Publishes the linux x86_64 binary consumed by Deepomatic/agent-brain (pinned there by
# version + sha256). Tag format: v<upstream version>-dp.<n>, e.g. v1.7.2-dp.1.
on:
  push:
    tags: ["v*-dp.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    container: rust:1-trixie
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends cmake g++ libclang-dev
      - name: Unit tests
        run: cargo test --release --lib
      - name: Chunker regression gate
        run: |
          cargo test --release --lib test_smart_chunk_no_overlap_crawl 2>&1 | tee /tmp/chunker.log
          grep -qE 'test result: ok\. 1 passed' /tmp/chunker.log
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          cp target/release/engraph engraph-linux-x86_64
          sha256sum engraph-linux-x86_64 > engraph-linux-x86_64.sha256
          cat engraph-linux-x86_64.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            engraph-linux-x86_64
            engraph-linux-x86_64.sha256
